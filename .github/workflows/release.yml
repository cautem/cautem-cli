#
# Tagged releases via GoReleaser. Semver pre-release suffixes → GitHub prerelease
# (prerelease: auto) — same pattern as HashiCorp / many Go corporate CLIs.
name: Release

env:
  CGO_ENABLED: "0"
  GOWORK: "off"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild (e.g. v0.1.8)"
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cautem-cli
        uses: actions/checkout@v4
        with:
          path: cautem-cli
          fetch-depth: 0

      - name: Check out requested tag for manual rebuild
        if: github.event_name == 'workflow_dispatch' && inputs.tag != ''
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: git -C cautem-cli checkout --detach "$RELEASE_TAG"

      # The CLI and Gateway builds consume the same published module versions
      # that release:published verifies. These source checkouts are needed only
      # for GoReleaser's companion Gateway binary, profile catalog and helpers.
      - name: Checkout cautem-gateway source
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-gateway
          path: cautem-gateway
          ref: fe37011c5372ff8f5a2440668666884266c9581f

      - name: Checkout cautem-runtime helper source
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-runtime
          path: cautem-runtime
          ref: 58cca1e35b2b8d7eddc0cbddfefaf6e7172fc215

      - name: Checkout cautem-providers profile catalog
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-providers
          path: cautem-providers
          ref: 7fb2983e4edd5367ccf8be17a08607225b02bd47

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
          cache-dependency-path: |
            cautem-cli/go.sum
            cautem-gateway/go.sum
            cautem-runtime/go.sum
            cautem-core/go.sum
            cautem-gateway/go.sum
            cautem-providers/go.sum

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.3
          workdir: cautem-cli
          args: release --clean --verbose
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOTOOLCHAIN: local

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0.24.0
        with:
          syft-version: v1.42.3

      - name: Generate SPDX SBOMs for release archives
        working-directory: cautem-cli
        env:
          SYFT_BIN: ${{ steps.syft.outputs.cmd }}
        run: bash scripts/generate-release-sboms.sh "$SYFT_BIN" dist

      - name: Upload SPDX SBOMs to the release
        working-directory: cautem-cli
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && inputs.tag || github.ref_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.spdx.json --clobber

      - name: Attest release archives
        uses: actions/attest@v4
        with:
          subject-path: |
            cautem-cli/dist/*.tar.gz
            cautem-cli/dist/*.zip

      - name: Attest published SBOM documents
        uses: actions/attest@v4
        with:
          subject-path: cautem-cli/dist/*.spdx.json
