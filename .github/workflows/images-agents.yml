name: images-agents

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "docker/agents/**"
      - ".github/workflows/images-agents.yml"
  pull_request:
    paths:
      - "docker/agents/**"
      - ".github/workflows/images-agents.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/cautem/cautem/sandboxes
  # Local tag only — GHCR base is private to cautem-runtime; buildx container
  # driver cannot pull it. Always build FROM a local docker-tagged base.
  LOCAL_BASE: cautem-sandbox:base
  GOWORK: ${{ github.workspace }}/go.work

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        agent: [cursor, claude, codex]
    steps:
      - uses: actions/checkout@v4
        with:
          path: cautem-cli
      - name: Checkout cautem-runtime
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-runtime
          path: cautem-runtime
          ref: 5c81d1f8fc3a54b74a2035f097c35672e94bfb74
      - name: Checkout cautem-core
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-core
          path: cautem-core
          ref: 3e8578194f94048a5c2619d2e1411eac546de985
      - name: Checkout cautem-driver
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-driver
          path: cautem-driver
          ref: 89a88e2fe3782144e6f41991e1b7aea56c1d516c
      - name: Checkout cautem-proxy
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-proxy
          path: cautem-proxy
          ref: dda81bc1d7cf13e403ccbdbd67717d08eb69f98a

      - name: Checkout slogx
        uses: actions/checkout@v4
        with:
          repository: cautem/slogx
          path: slogx
      - name: Write go.work
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "${{ github.workspace }}/go.work" <<'EOF'
          go 1.27.0
          use (
            ./cautem-runtime
            ./cautem-core
            ./cautem-driver
            ./cautem-proxy
            ./slogx
          )
          replace (
            github.com/cautem/cautem-runtime v0.1.0-alpha.1 => ./cautem-runtime
            github.com/cautem/cautem-runtime v0.1.0-alpha.2 => ./cautem-runtime
            github.com/cautem/cautem-runtime v0.1.6 => ./cautem-runtime
            github.com/cautem/cautem-runtime v0.1.8 => ./cautem-runtime
            github.com/cautem/cautem-core v0.1.0-alpha.1 => ./cautem-core
            github.com/cautem/cautem-core v0.1.0-alpha.2 => ./cautem-core
            github.com/cautem/cautem-core v0.1.6 => ./cautem-core
            github.com/cautem/cautem-driver v0.1.0-alpha.1 => ./cautem-driver
            github.com/cautem/cautem-driver v0.1.0-alpha.2 => ./cautem-driver
            github.com/cautem/cautem-driver v0.1.6 => ./cautem-driver
            github.com/cautem/cautem-driver v0.1.7 => ./cautem-driver
            github.com/cautem/cautem-proxy v0.1.0-alpha.1 => ./cautem-proxy
            github.com/cautem/cautem-proxy v0.1.0-alpha.2 => ./cautem-proxy
            github.com/cautem/cautem-proxy v0.1.6 => ./cautem-proxy
            github.com/cautem/cautem-proxy v0.1.8 => ./cautem-proxy
            github.com/cautem/slogx v0.1.0-alpha.1 => ./slogx
            github.com/cautem/slogx v0.1.0-alpha.2 => ./slogx
            github.com/cautem/slogx v0.1.3 => ./slogx
          )
          EOF
          # strip leading spaces from heredoc body
          sed -i 's/^          //' "${{ github.workspace }}/go.work"
          cat "${{ github.workspace }}/go.work"


      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
          cache-dependency-path: |
            cautem-*/go.sum
            slogx/go.sum
      # docker driver sees locally tagged images (container driver cannot).
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - name: Login GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build local base
        working-directory: ${{ github.workspace }}
        shell: bash
        env:
          GOWORK: ${{ github.workspace }}/go.work
        run: |
          set -euo pipefail
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -C cautem-runtime -o images/sandbox/cautem-init ./cmd/cautem-init
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -C cautem-runtime -o images/sandbox/cautem-supervisor ./cmd/cautem-supervisor
          if [[ -f cautem-runtime/cmd/cautem-sshd/main.go ]]; then
            CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -C cautem-runtime -o images/sandbox/cautem-sshd ./cmd/cautem-sshd
          fi
          docker build -t "${LOCAL_BASE}" --target cli \
            --build-arg DEBIAN_BASE=mirror.gcr.io/library/debian:bookworm@sha256:2c037a04925515fdd6ea85ea14a682d0e79931f5e9f5d07b6dbfc6ba12f9e858 \
            -f cautem-runtime/images/sandbox/Dockerfile \
            cautem-runtime/images/sandbox
          if [[ -x cautem-runtime/images/sandbox/cautem-sshd ]]; then
            docker run --rm --entrypoint /usr/local/bin/cautem-sshd "${LOCAL_BASE}" --help >/dev/null
          fi
      - name: Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.agent }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: cautem-cli/docker/agents/${{ matrix.agent }}
          file: cautem-cli/docker/agents/${{ matrix.agent }}/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BASE_IMAGE=${{ env.LOCAL_BASE }}
