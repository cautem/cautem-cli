      - name: Checkout cautem-proxy
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-proxy
          path: cautem-proxy
          ref: db748905153b6d7483034d2f20e96c4509996c84

      - name: Checkout cautem-runtime
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-runtime
          path: cautem-runtime
          ref: 58cca1e35b2b8d7eddc0cbddfefaf6e7172fc215

      - name: Checkout cautem-sdk
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-sdk
          path: cautem-sdk
          ref: 26cf7232e8f7c1d51da4b8f89a62a7bd229703d6

      - name: Checkout cautem-proto
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-proto
          path: cautem-proto
          ref: 0297d796a01ee3ef2c22aacb57d72080cde8add7

      - name: Checkout slogx
        uses: actions/checkout@v4
        with:
          repository: cautem/slogx
          path: slogx
      - name: Write go.work
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            for d in cautem-* slogx; do
              if [[ -d "$d" ]]; then
                echo "  ./$d"
              fi
            done
            echo ')'
            echo 'replace ('
            for d in cautem-*; do
              if [[ -d "$d" ]]; then
                echo "  github.com/cautem/${d} v0.1.0-alpha.1 => ./$d"
                echo "  github.com/cautem/${d} v0.1.0-alpha.2 => ./$d"
                echo "  github.com/cautem/${d} v0.1.0-beta.1 => ./$d"
                echo "  github.com/cautem/${d} v0.1.0-beta.2 => ./$d"
                echo "  github.com/cautem/${d} v0.1.0 => ./$d"
                for version in v0.1.0 v0.1.6 v0.1.7 v0.1.8; do
                  echo "  github.com/cautem/${d} ${version} => ./$d"
                done
              fi
            done
            if [[ -d slogx ]]; then
              echo '  github.com/cautem/slogx v0.1.0-alpha.1 => ./slogx'
              echo '  github.com/cautem/slogx v0.1.0-alpha.2 => ./slogx'
              echo '  github.com/cautem/slogx v0.1.0-beta.1 => ./slogx'
              echo '  github.com/cautem/slogx v0.1.0-beta.2 => ./slogx'
            echo '  github.com/cautem/slogx v0.1.3 => ./slogx'
            fi
            echo ')'
          } > "${{ github.workspace }}/go.work"
          echo "Wrote go.work:" && cat "${{ github.workspace }}/go.work"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
          cache-dependency-path: |
            cautem-*/go.sum
            slogx/go.sum
      - name: Download modules
        run: go mod download
      - name: Build
        run: go build ./...

      - name: Build and smoke proxy companion image
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          GOWORK="${{ github.workspace }}/go.work" CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -C cautem-cli -o "$stage/cautem" ./cmd/cautem
          cp cautem-cli/policies/default.yaml "$stage/default.yaml"
          docker build --platform linux/amd64 -t cautem-proxy:ci \
            -f cautem-cli/docker/proxy/Dockerfile "$stage"
          docker run --platform linux/amd64 --rm --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=16m \
            --entrypoint /usr/local/bin/cautem cautem-proxy:ci proxy --help >/dev/null

  test:
