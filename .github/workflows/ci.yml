#
# gogpu-style CI: format, lint, cross-platform build + test
name: CI

env:
  CGO_ENABLED: "0"
  GOWORK: ${{ github.workspace }}/go.work

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write  # Codecov OIDC

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cautem-cli
    steps:

      - name: Checkout cautem-cli
        uses: actions/checkout@v4
        with:
          path: cautem-cli

      - name: Checkout cautem-core
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-core
          path: cautem-core
          ref: 59fec9b4e887827515979fe01303f2d7152a96f6

      - name: Checkout cautem-display
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-display
          path: cautem-display
          ref: c58f1a09dd5e0c01ecb96aad5645ecfddbd1d636

      - name: Checkout cautem-driver
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-driver
          path: cautem-driver
          ref: 2bfed8c08c9c2a3d900980e8b80dcf0898bc17a4

      - name: Checkout cautem-providers
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-providers
          path: cautem-providers
          ref: 7fb2983e4edd5367ccf8be17a08607225b02bd47

      - name: Checkout cautem-proxy
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-proxy
          path: cautem-proxy
          ref: db748905153b6d7483034d2f20e96c4509996c84

      - name: Checkout cautem-runtime
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-runtime
          path: cautem-runtime
          ref: 58cca1e35b2b8d7eddc0cbddfefaf6e7172fc215

      - name: Checkout cautem-sdk
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-sdk
          path: cautem-sdk
          ref: 26cf7232e8f7c1d51da4b8f89a62a7bd229703d6

      - name: Checkout cautem-proto
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-proto
          path: cautem-proto
          ref: 0297d796a01ee3ef2c22aacb57d72080cde8add7

      - name: Checkout slogx
        uses: actions/checkout@v4
        with:
          repository: cautem/slogx
          path: slogx
      - name: Write go.work
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            for d in cautem-* slogx; do
              if [[ -d "$d" ]]; then
                echo "  ./$d"
              fi
            done
            echo ')'
            echo 'replace ('
            for d in cautem-*; do
              if [[ -d "$d" ]]; then
                echo "  github.com/cautem/${d} v0.1.0-alpha.1 => ./$d"
                echo "  github.com/cautem/${d} v0.1.0-alpha.2 => ./$d"
                echo "  github.com/cautem/${d} v0.1.0-beta.1 => ./$d"
                echo "  github.com/cautem/${d} v0.1.0-beta.2 => ./$d"
                echo "  github.com/cautem/${d} v0.1.0 => ./$d"
                for version in v0.1.0 v0.1.6 v0.1.7 v0.1.8; do
                  echo "  github.com/cautem/${d} ${version} => ./$d"
                done
              fi
            done
            if [[ -d slogx ]]; then
              echo '  github.com/cautem/slogx v0.1.0-alpha.1 => ./slogx'
              echo '  github.com/cautem/slogx v0.1.0-alpha.2 => ./slogx'
              echo '  github.com/cautem/slogx v0.1.0-beta.1 => ./slogx'
              echo '  github.com/cautem/slogx v0.1.0-beta.2 => ./slogx'
            echo '  github.com/cautem/slogx v0.1.3 => ./slogx'
            fi
            echo ')'
          } > "${{ github.workspace }}/go.work"
          echo "Wrote go.work:" && cat "${{ github.workspace }}/go.work"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
          cache-dependency-path: |
            cautem-*/go.sum
            slogx/go.sum
      - name: Check gofmt
        run: |
          set -euo pipefail
          bad="$(gofmt -l .)"
          if [[ -n "$bad" ]]; then
            echo "ERROR: not formatted:"
            echo "$bad"
            exit 1
          fi
          echo "gofmt: ok"

