#
# gogpu-style CI: format, lint, cross-platform build + test
name: CI

env:
  CGO_ENABLED: "0"
  GOWORK: ${{ github.workspace }}/go.work

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write  # Codecov OIDC

jobs:
  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cautem-cli
    steps:

      - name: Checkout cautem-cli
        uses: actions/checkout@v4
        with:
          path: cautem-cli

      - name: Checkout cautem-core
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-core
          path: cautem-core
          ref: 8e61f22c7922bc10e3b4e3e229d89eb7b3216645

      - name: Checkout cautem-display
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-display
          path: cautem-display
          ref: 84b73068da627be117fd6af1b50879f9c814659e

      - name: Checkout cautem-driver
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-driver
          path: cautem-driver
          ref: 37a3cf50252f437a57618bc5bb3397ce37cb9815

      - name: Checkout cautem-providers
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-providers
          path: cautem-providers
          ref: 58c132d1d47c8551b03ed37a8d7583db395d5276

      - name: Checkout cautem-proxy
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-proxy
          path: cautem-proxy
          ref: 3af1bc5a22fa167120fd87d8d53e22ff53429c45

      - name: Checkout cautem-runtime
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-runtime
          path: cautem-runtime
          ref: 846552ef43e80f0166fb3b284b4d56c99d112c08

      - name: Checkout cautem-sdk
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-sdk
          path: cautem-sdk
          ref: f984e040d0abf3d9ee712d61824567e84e831e28

      - name: Checkout cautem-proto
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-proto
          path: cautem-proto
          ref: 1665c3e56035854dadc068da8bee3a7e7527a37a

      - name: Checkout slogx
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-slogx
          path: slogx
      - name: Write go.work
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            for d in cautem-* slogx; do
              if [[ -d "$d" ]]; then
                echo "  ./$d"
              fi
            done
            echo ')'
          } > "${{ github.workspace }}/go.work"
          echo "Wrote go.work:" && cat "${{ github.workspace }}/go.work"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
          cache-dependency-path: |
            cautem-*/go.sum
            slogx/go.sum
      - name: Check gofmt
        run: |
          set -euo pipefail
          bad="$(gofmt -l .)"
          if [[ -n "$bad" ]]; then
            echo "ERROR: not formatted:"
            echo "$bad"
            exit 1
          fi
          echo "gofmt: ok"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cautem-cli
    steps:

      - name: Checkout cautem-cli
        uses: actions/checkout@v4
        with:
          path: cautem-cli

      - name: Checkout cautem-core
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-core
          path: cautem-core
          ref: 8e61f22c7922bc10e3b4e3e229d89eb7b3216645

      - name: Checkout cautem-display
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-display
          path: cautem-display
          ref: 84b73068da627be117fd6af1b50879f9c814659e

      - name: Checkout cautem-driver
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-driver
          path: cautem-driver
          ref: 37a3cf50252f437a57618bc5bb3397ce37cb9815

      - name: Checkout cautem-providers
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-providers
          path: cautem-providers
          ref: 58c132d1d47c8551b03ed37a8d7583db395d5276

      - name: Checkout cautem-proxy
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-proxy
          path: cautem-proxy
          ref: 3af1bc5a22fa167120fd87d8d53e22ff53429c45

      - name: Checkout cautem-runtime
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-runtime
          path: cautem-runtime
          ref: 846552ef43e80f0166fb3b284b4d56c99d112c08

      - name: Checkout cautem-sdk
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-sdk
          path: cautem-sdk
          ref: f984e040d0abf3d9ee712d61824567e84e831e28

      - name: Checkout cautem-proto
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-proto
          path: cautem-proto
          ref: 1665c3e56035854dadc068da8bee3a7e7527a37a

      - name: Checkout slogx
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-slogx
          path: slogx
      - name: Write go.work
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            for d in cautem-* slogx; do
              if [[ -d "$d" ]]; then
                echo "  ./$d"
              fi
            done
            echo ')'
          } > "${{ github.workspace }}/go.work"
          echo "Wrote go.work:" && cat "${{ github.workspace }}/go.work"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
          cache-dependency-path: |
            cautem-*/go.sum
            slogx/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          working-directory: cautem-cli
          args: --timeout=5m

  build:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: cautem-cli
    steps:

      - name: Checkout cautem-cli
        uses: actions/checkout@v4
        with:
          path: cautem-cli

      - name: Checkout cautem-core
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-core
          path: cautem-core
          ref: 8e61f22c7922bc10e3b4e3e229d89eb7b3216645

      - name: Checkout cautem-display
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-display
          path: cautem-display
          ref: 84b73068da627be117fd6af1b50879f9c814659e

      - name: Checkout cautem-driver
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-driver
          path: cautem-driver
          ref: 37a3cf50252f437a57618bc5bb3397ce37cb9815

      - name: Checkout cautem-providers
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-providers
          path: cautem-providers
          ref: 58c132d1d47c8551b03ed37a8d7583db395d5276

      - name: Checkout cautem-proxy
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-proxy
          path: cautem-proxy
          ref: 3af1bc5a22fa167120fd87d8d53e22ff53429c45

      - name: Checkout cautem-runtime
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-runtime
          path: cautem-runtime
          ref: 846552ef43e80f0166fb3b284b4d56c99d112c08

      - name: Checkout cautem-sdk
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-sdk
          path: cautem-sdk
          ref: f984e040d0abf3d9ee712d61824567e84e831e28

      - name: Checkout cautem-proto
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-proto
          path: cautem-proto
          ref: 1665c3e56035854dadc068da8bee3a7e7527a37a

      - name: Checkout slogx
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-slogx
          path: slogx
      - name: Write go.work
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            for d in cautem-* slogx; do
              if [[ -d "$d" ]]; then
                echo "  ./$d"
              fi
            done
            echo ')'
          } > "${{ github.workspace }}/go.work"
          echo "Wrote go.work:" && cat "${{ github.workspace }}/go.work"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
          cache-dependency-path: |
            cautem-*/go.sum
            slogx/go.sum
      - name: Download modules
        run: go mod download
      - name: Build
        run: go build ./...

      - name: Build and smoke proxy companion image
        if: runner.os == 'Linux'
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          GOWORK="${{ github.workspace }}/go.work" CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -C cautem-cli -o "$stage/cautem" ./cmd/cautem
          cp cautem-cli/policies/default.yaml "$stage/default.yaml"
          docker build --platform linux/amd64 -t cautem-proxy:ci \
            -f cautem-cli/docker/proxy/Dockerfile "$stage"
          docker run --platform linux/amd64 --rm --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=16m \
            --entrypoint /usr/local/bin/cautem cautem-proxy:ci proxy --help >/dev/null

  test:
    name: Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: cautem-cli
    steps:

      - name: Checkout cautem-cli
        uses: actions/checkout@v4
        with:
          path: cautem-cli

      - name: Checkout cautem-core
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-core
          path: cautem-core
          ref: 8e61f22c7922bc10e3b4e3e229d89eb7b3216645

      - name: Checkout cautem-display
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-display
          path: cautem-display
          ref: 84b73068da627be117fd6af1b50879f9c814659e

      - name: Checkout cautem-driver
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-driver
          path: cautem-driver
          ref: 37a3cf50252f437a57618bc5bb3397ce37cb9815

      - name: Checkout cautem-providers
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-providers
          path: cautem-providers
          ref: 58c132d1d47c8551b03ed37a8d7583db395d5276

      - name: Checkout cautem-proxy
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-proxy
          path: cautem-proxy
          ref: 3af1bc5a22fa167120fd87d8d53e22ff53429c45

      - name: Checkout cautem-runtime
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-runtime
          path: cautem-runtime
          ref: 846552ef43e80f0166fb3b284b4d56c99d112c08

      - name: Checkout cautem-sdk
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-sdk
          path: cautem-sdk
          ref: f984e040d0abf3d9ee712d61824567e84e831e28

      - name: Checkout cautem-proto
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-proto
          path: cautem-proto
          ref: 1665c3e56035854dadc068da8bee3a7e7527a37a

      - name: Checkout slogx
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-slogx
          path: slogx
      - name: Write go.work
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            for d in cautem-* slogx; do
              if [[ -d "$d" ]]; then
                echo "  ./$d"
              fi
            done
            echo ')'
          } > "${{ github.workspace }}/go.work"
          echo "Wrote go.work:" && cat "${{ github.workspace }}/go.work"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
          cache-dependency-path: |
            cautem-*/go.sum
            slogx/go.sum
      - name: Download modules
        run: go mod download
      - name: Vet
        if: matrix.os == 'ubuntu-latest'
        run: go vet ./...
      - name: Test (race + coverage)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -coverprofile=coverage.txt -covermode=atomic ./...
      - name: Test (race)
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...
      - name: Test
        if: matrix.os == 'windows-latest'
        shell: bash
        run: go test -count=1 ./...
      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: ./cautem-cli/coverage.txt
          flags: unittests
          name: codecov-cautem-cli
          fail_ci_if_error: false

  release-dry-run:
    name: Release archives + install.sh
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cautem-cli
        uses: actions/checkout@v4
        with:
          path: cautem-cli
          fetch-depth: 0

      - name: Checkout cautem-driver candidate
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-driver
          path: cautem-driver
          ref: 37a3cf50252f437a57618bc5bb3397ce37cb9815

      - name: Checkout cautem-gateway candidate
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-gateway
          path: cautem-gateway
          ref: d0ff9c827d9e91ee76a679db3728809d9b78787b

      - name: Checkout cautem-runtime candidate
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-runtime
          path: cautem-runtime
          ref: 846552ef43e80f0166fb3b284b4d56c99d112c08

      - name: Checkout cautem-sdk candidate
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-sdk
          path: cautem-sdk
          ref: f984e040d0abf3d9ee712d61824567e84e831e28

      - name: Checkout cautem-core candidate
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-core
          path: cautem-core
          ref: 8e61f22c7922bc10e3b4e3e229d89eb7b3216645

      - name: Checkout cautem-display candidate
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-display
          path: cautem-display
          ref: 84b73068da627be117fd6af1b50879f9c814659e

      - name: Checkout cautem-providers candidate
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-providers
          path: cautem-providers
          ref: 58c132d1d47c8551b03ed37a8d7583db395d5276

      - name: Checkout cautem-proxy candidate
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-proxy
          path: cautem-proxy
          ref: 3af1bc5a22fa167120fd87d8d53e22ff53429c45

      - name: Checkout cautem-proto candidate
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-proto
          path: cautem-proto
          ref: 1665c3e56035854dadc068da8bee3a7e7527a37a

      - name: Checkout quarshell-slogx candidate
        uses: actions/checkout@v4
        with:
          repository: cautem/quarshell-slogx
          path: slogx
          ref: 259d0347e17d8bcd02769a5e2b5e581094691de0

      - name: Write go.work
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'go 1.27.0'
            echo 'use ('
            for d in cautem-*; do echo "  ./$d"; done
            echo '  ./slogx'
            echo ')'
          } > go.work

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.2"
          cache: true
          cache-dependency-path: |
            cautem-*/go.sum
            slogx/go.sum

      - name: GoReleaser snapshot
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: v2.18.3
          workdir: cautem-cli
          args: release --snapshot --clean --skip=publish
        env:
          GOTOOLCHAIN: local

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0.24.0
        with:
          syft-version: v1.42.3

      - name: Generate and validate SPDX SBOMs for release archives
        working-directory: cautem-cli
        env:
          SYFT_BIN: ${{ steps.syft.outputs.cmd }}
        run: bash scripts/generate-release-sboms.sh "$SYFT_BIN" dist

      - name: Verify archive layout and install.sh
        working-directory: cautem-cli
        shell: bash
        run: |
          set -euo pipefail
          for a in dist/cautem_Linux_x86_64.tar.gz dist/cautem_Darwin_arm64.tar.gz; do
            arch=amd64; [[ "$a" == *arm64* ]] && arch=arm64
            list="$(tar -tzf "$a")"
            for f in cautem cautem-gateway cautem-console \
                     "libexec/cautem/linux-${arch}/cautem" \
                     "libexec/cautem/linux-${arch}/cautem-init" \
                     "libexec/cautem/linux-${arch}/cautem-sshd"; do
              grep -qx "\(\./\)\?${f}" <<<"$list" || { echo "missing ${f} in ${a}"; echo "$list"; exit 1; }
            done
            for f in providers/claude-code.yaml providers/cursor.yaml providers/github.yaml providers/nvidia.yaml; do
              grep -qx "\(\./\)\?${f}" <<<"$list" || { echo "missing ${f} in ${a}"; echo "$list"; exit 1; }
            done
          done
          gateway_list="$(tar -tzf dist/cautem-gateway_Linux_x86_64.tar.gz)"
          grep -qx "\(\./\)\?providers/claude-code.yaml" <<<"$gateway_list" || { echo "missing built-in profiles in standalone gateway archive"; echo "$gateway_list"; exit 1; }
          unzip -l dist/cautem_Windows_x86_64.zip | grep -q "libexec/cautem/linux-amd64/cautem-sshd"
          unzip -l dist/cautem_Windows_x86_64.zip | grep -q "providers/claude-code.yaml"

          mkdir -p /tmp/rel && ln -s "$PWD/dist" /tmp/rel/snapshot
          CAUTEM_RELEASE_URL=file:///tmp/rel CAUTEM_VERSION=snapshot \
            CAUTEM_INSTALL_DIR=/tmp/prefix/bin sh ./install.sh
          test -x /tmp/prefix/bin/cautem
          test -x /tmp/prefix/bin/cautem-gateway
          test -x /tmp/prefix/bin/cautem-console
          test -f /tmp/prefix/bin/providers/claude-code.yaml
          test -x /tmp/prefix/libexec/cautem/linux-amd64/cautem-sshd
          /tmp/prefix/bin/cautem provider profile show claude-code | grep -q '^id: claude-code$'
          /tmp/prefix/bin/cautem version
