          cache-dependency-path: |
            cautem-*/go.sum
            slogx/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          working-directory: cautem-cli
          args: --timeout=5m

  build:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: cautem-cli
    steps:

      - name: Checkout cautem-cli
        uses: actions/checkout@v4
        with:
          path: cautem-cli

      - name: Checkout cautem-core
        uses: actions/checkout@v4
        with:
          repository: cautem/cautem-core
          path: cautem-core
          ref: 59fec9b4e887827515979fe01303f2d7152a96f6

      - name: Checkout cautem-display
        uses: actions/checkout@v4
        with:
